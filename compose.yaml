name: workoutreach

services:
  workoutreach-postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: workoutreach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workoutreach_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - n8n_db_password
      - business_db_password
      - dashboard_db_password
    volumes:
      - workoutreach_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/010-workoutreach.sh:ro
    networks:
      - workoutreach_internal
    healthcheck:
      # The official image starts a temporary PostgreSQL server during first-time
      # initialization. PID 1 becomes postgres only after that server is stopped
      # and the durable server is ready, preventing dependent migrations racing it.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U workoutreach_admin -d workoutreach_business"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  workoutreach-n8n:
    image: n8nio/n8n:2.30.5@sha256:450853cd21a2ce36587c4c860eb26927c1ceba9496bf55f4c213b5d3a6dc8c6f
    container_name: workoutreach-n8n
    restart: unless-stopped
    entrypoint: ["/workoutreach/n8n-entrypoint.sh"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: workoutreach-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: workoutreach_n8n
      DB_POSTGRESDB_USER: workoutreach_n8n
      DB_POSTGRESDB_SCHEMA: public
      N8N_HOST: ${WORKOUTREACH_DOMAIN:-workoutreach.localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${WORKOUTREACH_DOMAIN:-workoutreach.localhost}/
      N8N_PROXY_HOPS: "1"
      TZ: ${TZ:-UTC}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Chisinau}
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_SSRF_PROTECTION_ENABLED: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile"]'
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    secrets:
      - n8n_db_password
      - n8n_encryption_key
    volumes:
      - workoutreach_n8n_data:/home/node/.n8n
      - ./docker/n8n/entrypoint.sh:/workoutreach/n8n-entrypoint.sh:ro
    networks:
      - workoutreach_internal
      - workoutreach_egress
    depends_on:
      workoutreach-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  workoutreach-proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: workoutreach-proxy
    restart: unless-stopped
    environment:
      WORKOUTREACH_DOMAIN: ${WORKOUTREACH_DOMAIN:-workoutreach.localhost}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-dashboard.workoutreach.localhost}
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - workoutreach_caddy_data:/data
      - workoutreach_caddy_config:/config
    networks:
      - workoutreach_edge
      - workoutreach_internal
    depends_on:
      workoutreach-n8n:
        condition: service_healthy
      workoutreach-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  workoutreach-migrate:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: workoutreach-migrate
    profiles: ["tools"]
    entrypoint: ["/workoutreach/migrate.sh"]
    secrets:
      - business_db_password
    volumes:
      - ./docker/postgres/migrate.sh:/workoutreach/migrate.sh:ro
      - ./migrations:/workoutreach/migrations:ro
    networks:
      - workoutreach_internal
    depends_on:
      workoutreach-postgres:
        condition: service_healthy

  workoutreach-dashboard-provision:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: workoutreach-dashboard-provision
    profiles: ["tools"]
    entrypoint: ["/workoutreach/provision-dashboard.sh"]
    secrets:
      - postgres_admin_password
      - dashboard_db_password
    volumes:
      - ./docker/postgres/provision-dashboard.sh:/workoutreach/provision-dashboard.sh:ro
    networks:
      - workoutreach_internal
    depends_on:
      workoutreach-postgres:
        condition: service_healthy

  workoutreach-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: workoutreach-dashboard:local
    container_name: workoutreach-dashboard
    restart: unless-stopped
    environment:
      DASHBOARD_HOST: ${DASHBOARD_DOMAIN:-dashboard.workoutreach.localhost}
      DASHBOARD_PORT: "3000"
      WORKOUTREACH_DB_HOST: workoutreach-postgres
      WORKOUTREACH_DB_PORT: "5432"
      WORKOUTREACH_DB_NAME: workoutreach_business
      TZ: UTC
    secrets:
      - dashboard_db_password
      - dashboard_password_hash
      - dashboard_session_secret
    networks:
      - workoutreach_internal
    depends_on:
      workoutreach-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get({host:'127.0.0.1',port:3000,path:'/healthz',headers:{Host:process.env.DASHBOARD_HOST}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  workoutreach-bot-smoke:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: workoutreach-bot:local-stage2
    container_name: workoutreach-bot-smoke
    profiles: ["tools"]
    entrypoint: ["node", "scripts/local-stage2-db-smoke.mjs"]
    secrets:
      - business_db_password
      - suppression_hmac_key
    networks:
      - workoutreach_internal
    depends_on:
      workoutreach-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  postgres_admin_password:
    file: ./.secrets/postgres_admin_password
  n8n_db_password:
    file: ./.secrets/n8n_db_password
  business_db_password:
    file: ./.secrets/business_db_password
  n8n_encryption_key:
    file: ./.secrets/n8n_encryption_key
  suppression_hmac_key:
    file: ./.secrets/suppression_hmac_key
  dashboard_db_password:
    file: ./.secrets/dashboard_db_password
  dashboard_password_hash:
    file: ./.secrets/dashboard_password_hash
  dashboard_session_secret:
    file: ./.secrets/dashboard_session_secret

volumes:
  workoutreach_postgres_data:
  workoutreach_n8n_data:
  workoutreach_caddy_data:
  workoutreach_caddy_config:

networks:
  workoutreach_edge:
  workoutreach_internal:
    internal: true
  workoutreach_egress:
