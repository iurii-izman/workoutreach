name: workoutreach-smoke

services:
  workoutreach-postgres:
    container_name: workoutreach-smoke-postgres

  workoutreach-n8n:
    container_name: workoutreach-smoke-n8n

  workoutreach-proxy:
    container_name: workoutreach-smoke-proxy
    ports: !override []

  workoutreach-dashboard:
    container_name: workoutreach-smoke-dashboard

  workoutreach-migrate:
    container_name: workoutreach-smoke-migrate

  workoutreach-dashboard-provision:
    container_name: workoutreach-smoke-dashboard-provision

  workoutreach-bot-smoke:
    container_name: workoutreach-smoke-bot
